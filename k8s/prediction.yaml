apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  labels:
    app: prediction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
    spec:
      containers:
        - name: prediction
          image: adaptive-scaler:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - prediction.serve:app
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: MODEL_PATH
              value: /workspace/prediction/models/qps_multi_step.joblib
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-service
spec:
  selector:
    app: prediction-service
  ports:
    - name: http
      port: 5000
      targetPort: 5000

