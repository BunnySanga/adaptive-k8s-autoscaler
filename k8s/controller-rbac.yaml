apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaptive-scaler-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adaptive-scaler-controller
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adaptive-scaler-controller
subjects:
  - kind: ServiceAccount
    name: adaptive-scaler-controller
roleRef:
  kind: Role
  name: adaptive-scaler-controller
  apiGroup: rbac.authorization.k8s.io

